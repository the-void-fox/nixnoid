# ═══════════════════════════════════════════════════════════════════════════
# Конфиг mango. home-manager кладёт его в ~/.config/mango/config.conf, а перед
# ним — строки из Nix: тему noctalia, курсор и мониторы
# (modules/desktop/sessions/mango/default.nix). Всё ниже их перекрывает.
#
# Этот файл ЗАМЕНЯЕТ /etc/mango/config.conf целиком, а не дополняет: системный
# читается, только когда пользовательского нет. Поэтому здесь перечислено всё,
# даже «стандартное» — без строки killclient окна нечем было бы закрыть.
#
# Справочник: /etc/mango/config.conf в пакете и docs/ в репозитории mango.
# Проверка: mango -c <файл> -p (именно в этом порядке). Имена клавиш — `wev`.
# ═══════════════════════════════════════════════════════════════════════════

# ── Внешний вид ─────────────────────────────────────────────────────────────
blur=0
shadows=0
border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2

# ── Анимации ────────────────────────────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_move=400
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=500

# ── Раскладки ───────────────────────────────────────────────────────────────
# Доступны: tile, scroller, grid, deck, monocle, center_tile,
#           vertical_tile, vertical_scroller, dwindle
scroller_structs=20
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Стартовая раскладка каждого тега. scroller на первом — он ближе всего к niri.
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:grid
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:monocle

# ── Режим обзора ────────────────────────────────────────────────────────────
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# ── Прочее ──────────────────────────────────────────────────────────────────
no_border_when_single=0
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1

# ── Ввод ────────────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=300
numlockon=1
xkb_rules_layout=us,ru
mouse_natural_scrolling=0

# ── Автозапуск ──────────────────────────────────────────────────────────────
# exec-once — один раз при старте; exec — на каждый reload_config.
exec-once=noctalia-shell

# ═══════════════════════════════════════════════════════════════════════════
# КЛАВИШИ
# Схема повторяет твой niri настолько, насколько позволяют действия mango.
# Модификатор везде SUPER (в niri он же Mod).
# ═══════════════════════════════════════════════════════════════════════════

# ── Запуск программ ─────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,ghostty
bind=SUPER,d,spawn,noctalia-shell ipc call launcher toggle
bind=SUPER,v,spawn,noctalia-shell ipc call launcher clipboard
bind=SUPER,period,spawn,noctalia-shell ipc call launcher emoji
bind=SUPER,Escape,spawn,noctalia-shell ipc call sessionMenu toggle
# Блокировка на SUPER+SHIFT+Escape, рядом с меню сессии: SUPER+L занят
# фокусом вправо, как в niri (Mod+L там focus-column-right).
bindl=SUPER+SHIFT,Escape,spawn,noctalia-shell ipc call lockScreen lock

# Скриншоты: команда screenshot из desktop/components/screenshot.
bind=SUPER,s,spawn,screenshot region
bind=SUPER+CTRL,s,spawn,screenshot screen
bind=SUPER+SHIFT,s,spawn,screenshot annotate

# ── Сессия и конфиг ─────────────────────────────────────────────────────────
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit
bind=SUPER,z,switch_keyboard_layout

# ── Окна ────────────────────────────────────────────────────────────────────
bind=SUPER,q,killclient,
bind=SUPER+SHIFT+CTRL,q,killclient,force
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+ALT,f,togglefakefullscreen,
bind=SUPER+SHIFT,t,togglefloating,
bind=SUPER+CTRL,t,toggle_all_floating,
bind=SUPER,c,centerwin,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized,1

# Блокнот: окно прячется «за кулисы» и возвращается той же клавишей.
bind=SUPER,grave,toggle_scratchpad,

# ── Обзор и переключение окон ───────────────────────────────────────────────
bind=SUPER,Tab,toggleoverview,
# togglejump, switcher, view_insert и focus_window_or_workspace появились в
# mango позже 0.14, а новее брать нельзя — см. default.nix про dwl-ipc и
# noctalia. Поэтому Alt+Tab — обычный перебор.
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER,a,focuslast,
bind=SUPER+SHIFT,a,exchange_stack_client,next

# ── Фокус ───────────────────────────────────────────────────────────────────
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,bracketleft,focusstack,prev
bind=SUPER,bracketright,focusstack,next

# ── Перемещение окна в раскладке ────────────────────────────────────────────
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER,m,zoom,

# ── Теги (аналог рабочих столов) ────────────────────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

# Перенести окно на тег (с переходом туда).
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Главная фишка тегов: окно может жить на НЕСКОЛЬКИХ сразу, а смотреть можно на
# объединение тегов. Этого в niri нет в принципе.
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+ALT,1,toggleview,1
bind=SUPER+ALT,2,toggleview,2
bind=SUPER+ALT,3,toggleview,3

# Соседние теги. j/k — как в niri (там это был переход по рабочим столам).
bind=SUPER,j,viewtoright_have_client,
bind=SUPER,k,viewtoleft_have_client,
bind=SUPER,Page_Down,viewtoright,
bind=SUPER,Page_Up,viewtoleft,
bind=SUPER+CTRL,j,tagtoright,
bind=SUPER+CTRL,k,tagtoleft,
bind=SUPER,Home,view,-1

# ── Мониторы ────────────────────────────────────────────────────────────────
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,l,tagmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
# Отдельного выключения подсветки нет; toggle_monitor убирает монитор из
# раскладки и возвращает обратно — ближайшее доступное.
bind=SUPER+SHIFT,p,toggle_monitor,HDMI-A-1

# Виртуальный монитор — на нём удобно отдавать картинку по сети, не занимая
# физический экран.
bind=SUPER+CTRL,p,create_virtual_output,
bind=SUPER+ALT,p,destroy_all_virtual_output,

# ── Раскладка окон ──────────────────────────────────────────────────────────
bind=SUPER,n,switch_layout,
bind=SUPER+SHIFT,n,setlayout,scroller
bind=SUPER+ALT,n,setlayout,tile
bind=SUPER+CTRL,n,setlayout,monocle
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,e,set_proportion,1.0
# Перемещение окна внутрь/наружу стопки в раскладке scroller.
bind=SUPER+CTRL,Up,scroller_stack,up
bind=SUPER+CTRL,Down,scroller_stack,down
bind=SUPER+SHIFT,b,toggle_render_border,
bind=SUPER,equal,setmfact,+0.05
bind=SUPER,minus,setmfact,-0.05
bind=SUPER+ALT,equal,incnmaster,+1
bind=SUPER+ALT,minus,incnmaster,-1
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps,

# ── Плавающие окна ──────────────────────────────────────────────────────────
bind=SUPER+ALT,Left,smartmovewin,left
bind=SUPER+ALT,Right,smartmovewin,right
bind=SUPER+ALT,Up,smartmovewin,up
bind=SUPER+ALT,Down,smartmovewin,down

# ── Режим изменения размера (демонстрация keymode) ──────────────────────────
# SUPER+W входит в режим: дальше стрелки меняют размер БЕЗ модификаторов,
# Escape или Return возвращают в обычный режим. Текущий режим: mmsg -g keymode
bind=SUPER,w,setkeymode,resize

keymode=resize
bind=NONE,Left,resizewin,-50,+0
bind=NONE,Right,resizewin,+50,+0
bind=NONE,Up,resizewin,+0,-50
bind=NONE,Down,resizewin,+0,+50
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

# common применяется во ВСЕХ режимах, включая resize.
keymode=common
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,Print,spawn,screenshot region

keymode=default

# ── Мышь ────────────────────────────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# Колесо с SUPER листает теги — как Mod+WheelScroll в niri.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Правила слоёв ───────────────────────────────────────────────────────────
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
